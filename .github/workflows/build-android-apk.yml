name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Dependências do Projeto
        run: npm ci

      - name: Compilar Aplicação Web (Vite)
        run: npm run build

      - name: Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: Permissão de Execução para Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: Coop-Agronorte-App-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
